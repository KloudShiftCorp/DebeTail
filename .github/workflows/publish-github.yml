name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        # global.json pins .NET 10 — setup-dotnet picks it up automatically

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore DebeTail.slnx

      - name: Build
        run: dotnet build DebeTail.slnx --no-restore -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test DebeTail.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack DebeTail.slnx --no-build -c Release -p:Version=${{ steps.version.outputs.value }} -o artifacts

      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/kloudshiftcorp/index.json --skip-duplicate
